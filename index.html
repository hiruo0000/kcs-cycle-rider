<style>
:root{
  --display:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Yu Gothic UI",system-ui,sans-serif;
  --body:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4","Arial Rounded MT Bold","Yu Gothic UI",system-ui,sans-serif;
  --cream:#FFF6E6; --cream-d:#EDD9B8;
  --ink:#242E3E; --ink-soft:#66799A;
  --green:#3BB273; --green-d:#26834F;
  --coral:#FF7A59; --coral-d:#D9482A;
  --sun:#FFC93D; --grape:#8C6BE0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  /* 外枠や飾りは置かず、ゲーム画面だけを見せる。
     ウィンドウの大きさが変わっても、16:9を保ったまま画面いっぱいに収める。 */
  margin:0;padding:0;
  height:100vh;              /* 古いブラウザ用 */
  height:100dvh;             /* Safari のツールバーの伸縮に追従する */
  overflow:hidden;
  font-family:var(--body);font-weight:800;color:var(--ink);
  background:#A8E4F2;
  display:flex;align-items:center;justify-content:center;overscroll-behavior:none;
}
/* 横に余裕があれば高さ基準、縦に余裕があれば横基準。
   どちらの場合も 16:9 のまま、はみ出さずに最大化する。 */
.stage{
  width:min(100vw, calc(100vh * 16 / 9));
  width:min(100vw, calc(100dvh * 16 / 9));
  height:min(100vh, calc(100vw * 9 / 16));
  height:min(100dvh, calc(100vw * 9 / 16));
}
/* ロゴは画面上部いっぱい、難易度ボタンは中央下、地面は高さの75%あたり。
   そのすき間（左側・高さ60%）に横1列で置く。
   縦並びや2×2だと、小さい画面で地面やロゴにぶつかるため。 */
.logo{font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px}
.logo .dot{width:30px;height:30px;border-radius:50%;background:var(--green);
  box-shadow:0 3px 0 var(--green-d);display:grid;place-items:center;color:#fff;font-size:16px}
.tag{font-size:11px;color:var(--ink-soft);background:#fff;border-radius:999px;
  padding:6px 12px;box-shadow:0 2px 0 var(--cream-d)}
.spacer{flex:1}
.screen{position:relative;overflow:hidden;background:#A8E4F2;width:100%;height:100%}
/* 操作ボタンは右上に横ならび。
   ロゴを内部座標 y=26 まで下げてあるので、その上の帯に収まる。
   子どもにも読めるよう、文字は大きめにしてある。 */
.bar{position:absolute;right:1.5%;top:1.6%;z-index:4;display:flex;gap:0.6%}
.tgl{font-family:var(--body);font-weight:900;
  /* タイトルとの釣り合いをとるため、以前の 7割ほどに縮めてある。
     幅・高さ・文字を同じ比率で下げているので、形は変わらない。
     幅はいちばん長い「こうかおん」（5文字）に合わせ、左右の余白を約7px以上残す。
     4つとも同じ大きさ。 */
  font-size:clamp(8px,1.47vw,14px);line-height:1;
  width:clamp(54px,9.5vw,94px);height:clamp(20px,3vw,32px);
  padding:0;border:2px solid var(--ink);border-radius:999px;cursor:pointer;
  background:rgba(255,246,230,.9);color:var(--ink);white-space:nowrap;
  box-shadow:0 2px 0 rgba(36,46,62,.25)}
.tgl[aria-pressed="false"]{background:rgba(198,192,180,.9);color:#7A746C}
.tgl:active{transform:translateY(2px);box-shadow:none}
.tgl:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;
  image-rendering:pixelated;image-rendering:crisp-edges}

.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:clamp(10px,2.4vw,20px);
  padding:clamp(16px,4.5vw,40px);background:rgba(255,246,230,.94)}
.overlay.on{display:flex}
.overlay.clear{background:transparent;padding:0;justify-content:flex-start}
/* 地面の帯は画面の 403〜540px。その中央 472px ＝ 高さの 87.4% に行の中心を置く。
   位置を割合で決めているので、ボタンの大きさや画面幅が変わってもずれない。 */
.overlay.clear .row{position:absolute;left:0;right:0;top:87.4%;
  transform:translateY(-50%);margin:0}
.title{font-weight:900;margin:0;line-height:1.2;font-size:clamp(20px,4.2vw,32px);text-shadow:0 3px 0 #fff}
.title em{font-style:normal;color:var(--green)}
.sub{margin:0;font-size:clamp(11px,2.3vw,14px);color:var(--ink-soft);line-height:1.7}
.howto{display:flex;gap:clamp(6px,1.4vw,12px);flex-wrap:wrap;justify-content:center}
.card{background:#fff;border-radius:16px;padding:clamp(7px,1.4vw,11px) clamp(9px,2vw,16px);
  box-shadow:0 3px 0 var(--cream-d);min-width:84px}
.card .ico{font-size:clamp(18px,3.6vw,25px);line-height:1.2}
.card .txt{font-size:clamp(9px,1.9vw,12px);font-weight:800;margin-top:2px}
.btn{font-family:var(--body);font-weight:900;color:#fff;border:0;cursor:pointer;
  background:var(--coral);box-shadow:0 5px 0 var(--coral-d);border-radius:999px;
  font-size:clamp(15px,2.9vw,19px);padding:clamp(10px,1.8vw,13px) clamp(24px,4.4vw,34px);
  min-height:52px;display:inline-flex;align-items:center;gap:8px;animation:pulse 1.9s ease-in-out infinite}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d);animation:none}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.green:active{box-shadow:0 1px 0 var(--green-d)}
.btn.plain{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--cream-d);animation:none}
.btn.plain:active{box-shadow:0 1px 0 var(--cream-d)}
.btn.small{font-size:clamp(13px,2.6vw,16px);padding:12px 26px;min-height:52px;
  background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--cream-d);animation:none}
.btn.small:active{box-shadow:0 1px 0 var(--cream-d)}
.btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.btn{animation:none}}

.stars{font-size:clamp(28px,6.2vw,46px);letter-spacing:5px;line-height:1}
.star{display:inline-block;color:#E4D6BC;transform:scale(.6);opacity:0}
.star.on{color:var(--sun);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.star.off{opacity:1;transform:scale(1)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg);opacity:0}
  70%{transform:scale(1.25) rotate(6deg);opacity:1}100%{transform:scale(1);opacity:1}}
.bigscore{font-family:var(--display);font-weight:800;color:var(--coral);
  font-size:clamp(38px,8.6vw,62px);line-height:.95;text-shadow:0 4px 0 #fff}
.klabel{font-size:11px;color:var(--ink-soft);letter-spacing:.16em}
.msg{font-size:clamp(13px,2.9vw,18px);font-weight:900}
.stats{display:flex;gap:clamp(6px,1.4vw,10px);flex-wrap:wrap;justify-content:center}
.stat{background:#fff;border-radius:15px;padding:8px 14px;box-shadow:0 3px 0 var(--cream-d);min-width:82px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(16px,3.4vw,22px);color:var(--green)}
.stat span{font-size:10px;color:var(--ink-soft)}
.best{font-size:clamp(11px,2.3vw,13px);color:var(--ink-soft)}
.row{display:flex;gap:clamp(10px,2.2vw,18px);align-items:center;flex-wrap:wrap;justify-content:center;margin-top:4px}
/* 「かんたん／むずかしい」「もどる／スタート」など、
   横に並ぶボタンは文字数がちがっても同じ幅にする */
.row .btn{width:clamp(132px,28vw,196px);padding-left:0;padding-right:0;justify-content:center}
.mlist{display:flex;flex-direction:column;gap:6px;align-items:stretch;max-width:420px;width:100%}
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;
  padding:8px 14px;box-shadow:0 3px 0 var(--cream-d);font-size:clamp(11px,2.4vw,14px)}
.mrow .ic{font-size:18px}
.mrow.done{background:#E9F9F0;color:var(--green-d)}
.mrow .rt{margin-left:auto;font-family:var(--display);font-weight:800}
.foot{margin-top:10px;text-align:center;font-size:11px;color:var(--ink-soft);line-height:1.8}
.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.srOnly:focus{position:absolute;width:auto;height:auto;clip:auto;margin:0;
  left:12px;top:12px;z-index:9;background:#fff;color:var(--ink);padding:10px 18px;
  border-radius:999px;box-shadow:0 4px 0 var(--cream-d);font-weight:900}
.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;
  background:var(--cream);font-size:14px;font-weight:900;color:var(--ink-soft)}
</style>
</head>

<div class="stage">
  <div class="screen">
    <canvas id="game" width="960" height="540" aria-label="サイクルライダー ゲーム画面"></canvas>
    <!-- 小さな操作ボタン。文字だけ。画面の右下にたてに並べる -->
    <div class="bar">
      <button class="tgl" id="bgmBtn" aria-pressed="true">おんがく</button>
      <button class="tgl" id="seBtn" aria-pressed="true">こうかおん</button>
      <button class="tgl" id="pauseBtn">やすむ</button>
      <button class="tgl" id="fsBtn" hidden>おおきく</button>
    </div>
    <div class="loading" id="loading">よみこみ中…</div>

    <!-- 絵は Canvas に描き、ボタンだけ HTML で重ねる -->
    <div class="overlay clear on" id="titleScreen">
      <div class="row">
        <button class="btn green" id="easyBtn">かんたん</button>
        <button class="btn" id="hardBtn">むずかしい</button>
      </div>
    </div>

    <div class="overlay clear" id="howtoScreen">
      <div class="row">
        <button class="btn plain" id="backBtn">もどる</button>
        <button class="btn green" id="startBtn">スタート</button>
      </div>
    </div>

    <div class="overlay" id="pauseScreen">
      <h2 class="title">ひとやすみ ちゅう</h2>
      <button class="btn green" id="resumeBtn">つづける</button>
      <div class="row">
        <button class="btn plain" id="quitBtn">さいしょから</button>
        <button class="btn plain" id="pauseHomeBtn">トップにもどる</button>
      </div>
    </div>

    <div class="overlay clear" id="overScreen">
      <div class="row">
        <button class="btn green" id="againBtn">もういちど</button>
        <button class="btn plain" id="homeBtn">トップにもどる</button>
      </div>
    </div>
  </div>

</div>

function setDPR(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = VW * SC * dpr;
  cvs.height = VH * SC * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
}

/** スプライトを内部座標に置く（必ず整数に丸める） */
function spr(name, x, y){
  const f = FRAMES[name];
  if (!f || !atlasReady) return;
  ctx.drawImage(ATLAS, f[0], f[1], f[2], f[3],
                Math.round(x) * SC, Math.round(y) * SC, f[2] * SC, f[3] * SC);
}
function sprW(name){ return FRAMES[name] ? FRAMES[name][2] : 0; }
function sprH(name){ return FRAMES[name] ? FRAMES[name][3] : 0; }
/** 横に敷きつめる（タイル） */
let VIEW_W = VW, VIEW_H = VH;      // 世界を描く範囲（トップ画面では広げる）
function tileX(name, offset, y, extra){
  const w = sprW(name);
  if (!w) return;
  let x = -((offset % w) + w) % w;
  const end = VIEW_W + (extra || 0);
  for (; x < end; x += w) spr(name, x, y);
}
/** 一定間隔ごとに1つだけ置く（雲や木など、敷きつめたくないもの） */
function spanX(name, offset, y, span, phase){
  let x = -((((offset + (phase||0)) % span) + span) % span);
  for (; x < VIEW_W; x += span) spr(name, x, y);
}
function rectV(x, y, w, h, col){
  ctx.fillStyle = col;
  ctx.fillRect(Math.round(x) * SC, Math.round(y) * SC, Math.round(w) * SC, Math.round(h) * SC);
}

let actx = null, seOn = true, bgmOn = true;
function ensureAudio(){
  if (!actx){
    try { actx = new (window.AudioContext||window.webkitAudioContext)(); Music.init(); }
    catch(e){ actx = null; }
  }
  if (actx && actx.state === "suspended") actx.resume();
}
function beep(freq, dur, type, vol, slideTo){
  if (!seOn || !actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"sine"; o.frequency.setValueAtTime(freq,t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.13, t+.012);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.02);
}

const Music = {
  master:null, timer:null, step:0, nextT:0, playing:false, track:TRACK_TITLE, pending:null,
  init(){ if(!actx||this.master) return;
    this.master = actx.createGain(); this.master.gain.value = bgmOn?0.9:0;
    this.master.connect(actx.destination); },
  stepDur(){ return 60/this.track.bpm/2; },
  start(){ if(!actx) return; this.init(); if(this.playing) return;
    // 止まっていたときは、待たずに指定された曲から始める
    if (this.pending){ this.track = this.pending; this.pending = null; }
    this.playing=true; this.step=0; this.nextT=actx.currentTime+.06;
    this.timer=setInterval(()=>this.tick(),25); },
  stop(){ this.playing=false; if(this.timer){clearInterval(this.timer); this.timer=null;} },
  setMode(n){ const t = n==="cycle" ? TRACK_CYCLE : n==="title" ? TRACK_TITLE : TRACK_NORMAL;
    if(this.track===t||this.pending===t) return; this.pending=t; },
  tick(){ if(!actx||!this.playing) return;
    while(this.nextT < actx.currentTime+.18){
      if(this.step%8===0 && this.pending){ this.track=this.pending; this.pending=null; }
      this.play(this.step, this.nextT);
      this.nextT += this.stepDur(); this.step=(this.step+1)%32;
    } },
  tone(f,t,d,ty,v,det){ const o=actx.createOscillator(), g=actx.createGain();
    o.type=ty; o.frequency.value=f; if(det) o.detune.value=det;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.015);
    g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+.02); },
  play(i,t){ const tr=this.track, d=this.stepDur();
    if(tr.lead[i]!=null){ this.tone(mid(tr.lead[i]),t,d*1.5,tr.leadType,tr.leadVol);
      this.tone(mid(tr.lead[i]),t,d*1.5,tr.leadType,tr.leadVol*.45,8); }
    if(tr.bass[i]!=null) this.tone(mid(tr.bass[i]),t,d*.9,"sine",tr.bassVol);
    if(tr.kick[i]){ const o=actx.createOscillator(), g=actx.createGain();
      o.type="sine"; o.frequency.setValueAtTime(150,t);
      o.frequency.exponentialRampToValueAtTime(48,t+.13);
      g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.0001,t+.16);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t+.2); }
    if(tr.hat[i]) this.tone(9200,t+d*.5,.028,"square",.014); },
};

function toggleFS(){
  if (!canFS) return;
  if (isFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else        (docEl.requestFullscreen || docEl.webkitRequestFullscreen).call(docEl);
}

function spawnObstacle(){
  const d = G.d;
  // むずかしいだけ、ときどき障害物のかわりに落とし穴を置く
  if (d.pit && G.t > d.pitFrom && Math.random() < d.pit){
    const w = Math.round(rnd(d.pitMin, d.pitMax));
    G.pits.push({ x: VW + 20, w });
    return;
  }
  if (d.crow && G.t > 8 && Math.random() < d.crow){
    // カラスは空を飛ぶ。しゃがめないので、当たらない高さに散らす
    const y = rnd(d.crowY[0], d.crowY[1]);
    G.crows.push({ x: VW + 24, y, y0:y, bob: rnd(0, 6.28) });
    return;
  }
  const t = pick(OBST);
  G.obstacles.push({ ...t, x: VW + 20, y: GY - t.h + 2, passed:false, near:false });
}
function spawnItems(flock){
  const n = flock ? 9 : 4 + ((Math.random()*3)|0);
  const arc = flock ? true : Math.random() < .62;
  const gap = flock ? 20 : 24;
  const sx = VW + 20;
  for (let i=0;i<n;i++){
    const p = n===1 ? .5 : i/(n-1);
    const y = arc ? GY - 40 - Math.sin(p*Math.PI)*26 : GY - 34;
    G.items.push({ x:sx+i*gap, y, kind:pick(CLOTHES), type:"cloth", bob:rnd(0,6.28) });
  }
  if (!flock && Math.random() < .26)
    G.items.push({ x:sx+n*gap+34, y:GY-72, kind:"coin", type:"coin", bob:rnd(0,6.28) });
}

/* ══════════════════════════════════════════════
   6. そうさ
   ══════════════════════════════════════════════ */
let lastPress = 0;
function jump(){
  // 高さは常に同じ。長押しで変わる仕組みは、子どもには失敗の元になるので入れない。
  const p = G.player;
  if (p.jumps >= 2){ p.buffer = 0.16; return; }   // 早すぎた入力は覚えておく
  if (p.jumps === 0){ p.vy=-G.d.jumpV; p.jumps=1; p.onGround=false; sfx.jump(); }
  else if (p.jumps === 1){ p.vy=-G.d.jump2; p.jumps=2; sfx.jump2();
    for(let i=0;i<8;i++) G.parts.push(part(p.x+28,p.y+48,"#fff")); }
}
function releaseJump(){ /* 押し方でジャンプは変わらない */ }
function press(e){
  ensureAudio();
  // ブラウザの決まりで、音は最初の操作以降しか鳴らせない。ここで始める。
  if (bgmOn && !Music.playing && (state==="title" || state==="howto")){
    Music.setMode("title"); Music.start();
  }
  const now = performance.now();
  if (now - lastPress < 90) return;
  lastPress = now;
  if (state === "play") jump();
  if (e && e.cancelable) e.preventDefault();
}
cvs.addEventListener("pointerdown", press);
cvs.addEventListener("pointerup", releaseJump);
cvs.addEventListener("pointercancel", releaseJump);
window.addEventListener("keydown", e=>{
  if (["Space","ArrowUp","Enter"].includes(e.code)){
    if (state==="title") goHowto("easy");
    else if (state==="howto") startGame();
    else if (state==="over") startGame();
    else if (state==="pause") resume();
    else press(e);
    e.preventDefault();
  }
  if (e.code==="Escape" && state==="play") pauseGame();
});
window.addEventListener("keyup", e=>{
  if (["Space","ArrowUp"].includes(e.code)) releaseJump();
});
// 音は最初の操作以降しか鳴らせないので、難易度を選んだここで始める
function startTitleBgm(){
  if (bgmOn && !Music.playing){ Music.setMode("title"); Music.start(); }
}
els.easy.addEventListener("click", ()=>{ ensureAudio(); startTitleBgm(); goHowto("easy"); });
els.hard.addEventListener("click", ()=>{ ensureAudio(); startTitleBgm(); goHowto("hard"); });
els.start.addEventListener("click", ()=>{ ensureAudio(); startGame(); });
els.back.addEventListener("click", ()=>{ els.howto.classList.remove("on"); goTitle(); });
els.again.addEventListener("click", ()=>{ ensureAudio(); startGame(); });
els.home.addEventListener("click", goTitle);
els.resume.addEventListener("click", resume);
els.quit.addEventListener("click", ()=>{ els.pause.classList.remove("on"); startGame(); });
els.pauseHome.addEventListener("click", ()=>{ els.pause.classList.remove("on");  goTitle(); });
function syncPauseIcon(){ els.pauseBtn.textContent = state==="pause" ? "つづける" : "やすむ"; }

/* ══════════════════════════════════════════════
   7. エフェクト
   ══════════════════════════════════════════════ */
const part = (x,y,col) => ({x,y,vx:rnd(-50,50),vy:rnd(-95,-18),life:rnd(.4,.9),age:0,r:rnd(1,2.6),col});
const pop = (x,y,text,col,big) => G.pops.push({x,y,text,col,age:0,life:.7,big:!!big});
const banner = (text,col,life) => { G.banner = {text,col,age:0,life:life||1.4}; };

/* ══════════════════════════════════════════════
   8. しんこう
   ══════════════════════════════════════════════ */
function startGame(m){
  if (m) mode = m;
  G = newGame(); state = "count";
  els.title.classList.remove("on"); els.over.classList.remove("on");
  els.pause.classList.remove("on"); els.howto.classList.remove("on");
  ensureAudio();
  sfx.start();                                   // スタートの合図
  // タイトル曲から、遊ぶときの曲へ小節の頭で切り替わる
  if (bgmOn){ Music.setMode("normal"); Music.start(); }
  setTimeout(()=>sfx.count(523), 340);
}
function goTitle(){
  state="title"; G=newGame();
  if (bgmOn){ Music.setMode("title"); Music.start(); }   // トップでも音楽を鳴らす
  els.over.classList.remove("on"); els.pause.classList.remove("on");
  els.howto.classList.remove("on");
  els.title.classList.add("on");
}
/** 難易度を選んだあとの「あそびかた」画面 */
function goHowto(m){
  if (m) mode = m;
  state="howto"; G=newGame();
  els.title.classList.remove("on"); els.over.classList.remove("on");
  els.howto.classList.add("on");
}
function pauseGame(){ if(state!=="play") return; state="pause"; Music.stop(); syncPauseIcon();
  els.pause.classList.add("on");  }
function resume(){ if(state!=="pause") return; state="play"; syncPauseIcon();
  els.pause.classList.remove("on"); 
  if(bgmOn) Music.start(); last=performance.now(); }

function gameOver(){
  state="over"; Music.stop();
  G.pops.length = 0;      // 「+15」などの浮き文字を消してから結果を出す
  G.parts.length = 0;
  G.banner = null;
  sfx.over();
  setTimeout(()=>sfx.result(), 700);
  const sc = Math.floor(G.score);
  best = Math.max(best, sc);
  G.newBest = sc >= best && sc > 0;
  G.stars = sc>3200 ? 3 : sc>1600 ? 2 : sc>600 ? 1 : 0;
  G.overT = 0;
  for (let i=0;i<G.stars;i++) setTimeout(()=>sfx.star(i), 400+i*300);
  els.over.classList.add("on");
}

let last = performance.now();
function loop(now){
  let dt = (now-last)/1000; last = now;
  dt = Math.min(dt, 1/30);
  if (state==="count") countdown(dt);
  else if (state==="play") update(dt);
  else if (state==="title" || state==="howto") titleUpdate(dt);
  else if (state==="over" && G) G.overT += dt;
  render();
  requestAnimationFrame(loop);
}
function titleUpdate(dt){
  // トップ画面でも景色をゆっくり流し、主人公は走り続ける
  G.t += dt;
  G.scroll += 26*dt;
}
function countdown(dt){
  // 説明画面の小さい世界から、遊ぶ大きさへ寄っていく（最初の0.7秒）
  if (G.zoom > 0) G.zoom = Math.max(0, G.zoom - dt/0.7);
  G.countT += dt;
  if (G.countT >= .62){
    G.countT = 0; G.count--;
    if (G.count>0) sfx.count(523+(3-G.count)*80);
    else if (G.count===0) sfx.count(1046);
    if (G.count<0){ state="play"; last=performance.now(); }
  }
}

function update(dt){
  const p = G.player;

  // 穴に落ちている間は、景色も障害物も止めて、まっすぐ真下に落とす。
  // 世界が動かないので、落ちながら地面をすり抜けることがない。
  if (G.falling){
    p.vy += G.d.grav*dt;
    p.y  += p.vy*dt;
    if (p.y > VH + 24) gameOver();
    return;
  }

  G.t += dt;
  const target = G.d.speed0 + Math.min(G.t*G.d.accel, G.d.speedUp);
  G.speed += (target-G.speed)*dt*.9;
  const sp = G.speed * (G.cycleLeft>0 ? 1.14 : 1);
  G.scroll += sp*dt;
  G.score += dt*7 * (G.cycleLeft>0 ? 2 : 1);

  // 落とし穴を流す。足元が穴の上なら、地面がないので落ちる。
  for (let i=G.pits.length-1;i>=0;i--){
    const q = G.pits[i];
    q.x -= sp*dt;
    if (q.x + q.w < -40) G.pits.splice(i,1);
  }
  // 落ちるのは「主人公が穴にすっぽり収まったとき」だけ。
  // ふちに half かかっている間は落ちないので、体が地面に食い込んで見えない。
  const overPit = G.pits.some(q => p.x >= q.x && p.x + p.w <= q.x + q.w);

  const grav = G.d.grav;
  p.vy += grav*dt; p.y += p.vy*dt;
  if (G.falling){
    // 落ちはじめたら地面には戻さない。画面の外まで落ちたら終わり。
    p.onGround = false;
    if (p.y > VH + 20){ gameOver(); return; }
  } else if (overPit && p.y >= GY-p.h){
    G.falling = true; p.onGround = false;
    G.shake = .3; sfx.hit();
    for (let k=0;k<10;k++) G.parts.push(part(p.x+28, GY, "#8C6540"));
  } else if (p.y >= GY-p.h){
    if (!p.onGround) for(let i=0;i<6;i++) G.parts.push(part(p.x+28,GY,"#CEA576"));
    p.y = GY-p.h; p.vy = 0; p.onGround = true; p.jumps = 0;
    if (p.buffer > 0){ p.buffer = 0; jump(); }      // 覚えていた入力をここで発動
  } else p.onGround = false;
  if (p.buffer > 0) p.buffer -= dt;

  if (G.invuln>0) G.invuln-=dt;
  if (G.shake>0)  G.shake-=dt;
  if (G.flash>0)  G.flash-=dt;
  if (G.comboT>0){ G.comboT-=dt; if(G.comboT<=0) G.combo=0; }

  if (G.cycleLeft>0){
    G.cycleLeft -= dt;
    if (G.cycleLeft<=0){
      G.cycleLeft = 0;
      // 引き寄せ途中だったぶんも、ここで全部回収してしまう。
      // （残すと、しょうがいぶつの上に止まって重なって見えるため）
      let n = 0;
      for (let i=G.items.length-1;i>=0;i--){
        const it = G.items[i];
        if (it.x < VW-10){
          G.items.splice(i,1);
          if (it.type==="coin"){ G.coins++; G.score += 50; }
          else { G.clothes++; G.score += 10; n++; }
        }
      }
      if (n>0){
        const p2 = G.player;
        pop(p2.x+28, p2.y-6, "+"+n, "#26834F", true);
        sfx.pick(n);
        for(let k=0;k<8;k++) G.parts.push(part(p2.x+28,p2.y+24,"#83D8A6"));
        }
      banner("また あつめよう！","#3BB273",1.2);
      if(bgmOn) Music.setMode("normal");
    }
  }

  // シャボン玉の大群（ときどき起きるボーナス）
  G.flockT -= dt;
  if (G.flockT <= 0 && G.cycleLeft <= 0){
    G.flockT = rnd(30, 46);
    G.flockLeft = 1;
    banner("シャボン玉の たいぐん！","#5B8DD9",1.5);
    sfx.flock();
  }

  // ── 出現：シャボン玉と障害物が重ならないよう、たがいに場所を空ける ──
  const CLEAR = 46;                       // これだけ間を空ける（内部座標）
  // 出そうとしている場所に、もう相手がいないか
  const freeFor = (x0, x1) =>
    !G.obstacles.some(o => o.x - CLEAR < x1 && o.x + o.w + CLEAR > x0) &&
    !G.pits.some(q => q.x - CLEAR*1.6 < x1 && q.x + q.w + CLEAR*1.6 > x0) &&
    !G.crows.some(k => k.x - CLEAR < x1 && k.x + 30 + CLEAR > x0) &&
    !G.items.some(it => it.x - 13 - CLEAR < x1 && it.x + 13 + CLEAR > x0);

  G.dOb -= sp*dt;
  if (G.dOb<=0){
    if (freeFor(VW+20, VW+20+40)){
      spawnObstacle();
      const warm = 1 + G.d.warm * Math.max(0, 1 - G.t/30);
      G.dOb = rnd(G.d.gapMin, G.d.gapMax) * (sp/G.d.speed0) * warm;
    } else {
      G.dOb = 24;                         // 空くまで少し待つ
    }
  }
  G.dIt -= sp*dt;
  if (G.dIt<=0){
    const span = (G.flockLeft>0 ? 9*20 : 6*24) + 26;
    if (freeFor(VW+20, VW+20+span)){
      spawnItems(G.flockLeft>0);
      if (G.flockLeft>0) G.flockLeft = 0;
      G.dIt = rnd(240,340) * (sp/G.d.speed0);
    } else {
      G.dIt = 24;
    }
  }

  // しょうがいぶつ
  // 当たり判定は見た目よりかなり小さく（子ども向けに寛容に）
  const pb = { x:p.x+21, y:p.y+16, w:20, h:p.h-26 };
  for (let i=G.obstacles.length-1;i>=0;i--){
    const o = G.obstacles[i];
    o.x -= sp*dt;
    if (o.x+o.w < -30){ G.obstacles.splice(i,1); continue; }
    const ob = { x:o.x+8, y:o.y+5, w:o.w-16, h:o.h-5 };
    const hit = pb.x<ob.x+ob.w && pb.x+pb.w>ob.x && pb.y<ob.y+ob.h && pb.y+pb.h>ob.y;
    if (hit){
      if (G.cycleLeft>0){
        G.obstacles.splice(i,1);
        for(let k=0;k<12;k++) G.parts.push(part(o.x+o.w/2,o.y+o.h/2,"#FFC93D"));
        G.score += 20; pop(o.x+o.w/2,o.y,"+20","#FFC93D"); sfx.pick(4);
      } else if (G.invuln<=0){
        G.lives--; G.invuln=1.7; G.shake=.35; G.flash=.22; G.combo=0; G.comboT=0;
        sfx.hit();
        for(let k=0;k<14;k++) G.parts.push(part(p.x+28,p.y+26,"#FF7A59"));
        G.obstacles.splice(i,1);
        if (G.lives<=0){ gameOver(); return; }
        banner("だいじょうぶ！","#FF7A59",1.1);
      }
    } else if (!o.passed && o.x + o.w < p.x + 8){
      // ギリギリ回避（すぐ上を飛び越えた）
      o.passed = true;
      if (!p.onGround && (p.y + p.h) > o.y - 14 && G.cycleLeft<=0){
        G.nears++; G.score += 15;
        pop(p.x+28, p.y-4, "ギリギリ！", "#5B8DD9");
        sfx.near();
        }
    }
  }

  // カラス：ふわふわ上下しながら向かってくる。当たるとハートが1へる。
  for (let i=G.crows.length-1;i>=0;i--){
    const k = G.crows[i];
    k.x -= sp*1.12*dt;                       // 少しだけ速い
    k.bob += dt*3.4;
    k.y = k.y0 + Math.sin(k.bob)*5;
    if (k.x < -40){ G.crows.splice(i,1); continue; }
    const kb = { x:k.x+8, y:k.y+7, w:15, h:9 };   // 判定は見た目より小さく
    if (pb.x<kb.x+kb.w && pb.x+pb.w>kb.x && pb.y<kb.y+kb.h && pb.y+pb.h>kb.y){
      if (G.cycleLeft>0){
        G.crows.splice(i,1);
        for(let n=0;n<12;n++) G.parts.push(part(k.x+14,k.y+10,"#FFC93D"));
        G.score += 20; pop(k.x+14, k.y, "+20", "#FFC93D"); sfx.pick(4);
      } else if (G.invuln<=0){
        G.lives--; G.invuln=1.7; G.shake=.35; G.flash=.22; G.combo=0; G.comboT=0;
        sfx.hit();
        for(let n=0;n<14;n++) G.parts.push(part(p.x+28,p.y+26,"#FF7A59"));
        G.crows.splice(i,1);
        if (G.lives<=0){ gameOver(); return; }
        banner("だいじょうぶ！","#FF7A59",1.1);
      }
    }
  }

  // アイテム
  const cycling = G.cycleLeft>0;
  const pcx = p.x+p.w/2, pcy = p.y+p.h/2;
  for (let i=G.items.length-1;i>=0;i--){
    const it = G.items[i];
    it.bob += dt*4;
    if (cycling && it.x < VW){
      // 画面に見えているシャボン玉は、うしろに置いていったものも含めて必ず取れる
      const dx=pcx-it.x, dy=pcy-it.y, d=Math.hypot(dx,dy)||1;
      const v = Math.max(210, d*4.2);
      it.x += dx/d*v*dt;
      it.y += dy/d*v*dt;
    } else {
      it.x -= sp*dt;
    }
    if (it.x < -30){ G.items.splice(i,1); continue; }
    if (Math.hypot(pcx-it.x, pcy-it.y) < 22){
      G.items.splice(i,1);
      const mul = cycling ? 2 : 1;
      G.combo++; G.comboT = 2.8;
      G.maxCombo = Math.max(G.maxCombo, G.combo);
      if (it.type==="coin"){
        G.coins++; G.score += 50*mul;
        pop(it.x,it.y-8,"+"+(50*mul),"#FFC93D",true); sfx.coin();
        for(let k=0;k<12;k++) G.parts.push(part(it.x,it.y,"#FFC93D"));
      } else {
        G.clothes++;
        const bonus = G.combo>=5 ? 5 : 0;
        G.score += (10+bonus)*mul;
        pop(it.x,it.y-8,"+"+((10+bonus)*mul),"#26834F");
        sfx.pick(G.combo);
        for(let k=0;k<6;k++) G.parts.push(part(it.x,it.y,"#83D8A6"));
        if (G.combo===5||G.combo===10||G.combo===15)
          banner(G.combo+"れんぞく！ "+pick(CHEERS),"#8C6BE0",1.2);
        if (!cycling){
          G.gauge++;
          if (G.gauge%5===0 && G.gauge<CYCLE_NEED){
            pop(pcx,pcy-30,G.gauge+"まい","#26834F",true);
            beep(560+G.gauge*8,.13,"triangle",.09,880+G.gauge*10);
          }
          if (G.gauge>=CYCLE_NEED){
            G.gauge=0; G.cycleCount++; G.cycleLeft=CYCLE_TIME;
            banner("サイクルタイム！","#FF7A59",1.9);
            sfx.cycle();
            if(bgmOn) Music.setMode("cycle");
            for(let k=0;k<36;k++) G.parts.push(part(pcx,pcy,pick(["#FF7A59","#FFC93D","#3BB273","#5B8DD9","#8C6BE0"])));
          }
        }
      }
    }
  }

  for (let i=G.parts.length-1;i>=0;i--){
    const q=G.parts[i]; q.age+=dt; q.vy+=300*dt; q.x+=q.vx*dt; q.y+=q.vy*dt;
    if (q.age>q.life) G.parts.splice(i,1);
  }
  for (let i=G.pops.length-1;i>=0;i--){
    const q=G.pops[i]; q.age+=dt; q.y-=26*dt;
    if (q.age>q.life) G.pops.splice(i,1);
  }
  if (G.banner){ G.banner.age+=dt; if(G.banner.age>G.banner.life) G.banner=null; }
}

/* ══════════════════════════════════════════════
   9. えがく
   ══════════════════════════════════════════════ */
// 空は1色。段差があると帯に見えるので分けない。
// 空は画面いっぱいに敷く。落とし穴からはこの背景が見える。
const SKY_BANDS = [[0, VH, "#A8E4F2"]];

function render(){
  const g = G || newGame();
  /* 世界の縮尺。
     トップ・説明画面は 0.4倍で小さく、遊ぶときは 1.0倍。
     カウントダウンの最初の0.6秒で、小さい絵から遊ぶ大きさへ寄っていく。 */
  const zoom = (state === "count" && G) ? G.zoom : 0;         // 1=説明の大きさ 0=遊ぶ大きさ
  const shrunk = (state === "title" || state === "howto");
  const k = shrunk ? 0.4 : (0.4 + (1 - 0.4)*(1 - zoom));      // いまの倍率
  const small = shrunk || zoom > 0;

  if (small){
    ctx.fillStyle = "#A8E4F2";
    ctx.fillRect(0, 0, VW*SC, VH*SC);    // 先に空でうめる
  }
  ctx.save();
  if (small){
    /* 地面の画面上の高さを、倍率が変わってもなめらかにつなぐ。
       0.4倍のとき403px（ボタンの上）、1.0倍のとき462px（通常のプレイ画面）。 */
    const groundY = 403 + (462 - 403) * (k - 0.4) / (1 - 0.4);
    ctx.translate(0, groundY - GY*SC*k);
    ctx.scale(k, k);
    VIEW_W = Math.ceil(VW/k); VIEW_H = Math.ceil(VH/k);
  }
  if (g.shake>0){ const s=g.shake*8; ctx.translate(rnd(-s,s)*SC, rnd(-s,s)*SC); }

  // 空
  SKY_BANDS.forEach(([a,b,c])=>rectV(0,a,VIEW_W,b-a,c));

  const sc = g.scroll;
  // ① 雲（間隔をあけて配置）
  spanX("cloudB", Math.round(sc*0.10), 14, 210, 0);
  spanX("cloudS", Math.round(sc*0.10), 42, 260, 90);
  spanX("cloudS", Math.round(sc*0.10), 22, 330, 200);
  // ② 遠景
  tileX("far", Math.round(sc*0.18), GY-30-sprH("far"));
  // ③ 中景（建物どうしが重なる）
  tileX("mid", Math.round(sc*0.34), GY-14-sprH("mid"));
  // ④ 近景の建物
  const blds = ["bld0","bld1","bld2"], gaps=[22,30,26];
  let span = 0; blds.forEach((b,i)=>span += sprW(b)+gaps[i]);
  if (span>0){
    let x = -(((Math.round(sc*0.55)) % span) + span) % span;
    for (let k=0;k<4;k++){
      blds.forEach((b,i)=>{ spr(b, x, GY-sprH(b)+3); x += sprW(b)+gaps[i]; });
      if (x > VIEW_W) break;
    }
  }
  // ⑤ 生垣（建物の足元を隠して遊ぶ面と分ける）
  tileX("hedge", Math.round(sc*0.7), GY-16);
  // ⑥ 木
  const tspan = 420;
  let tx = -(((Math.round(sc*0.8)) % tspan) + tspan) % tspan;
  for (let base=tx-tspan; base<VIEW_W; base+=tspan)
    [40,250,400].forEach(dx=>{ spr("tree", base+dx, GY-sprH("tree")+10); });
  // ⑦ 地面
  tileX("ground", Math.round(sc), GY-8);
  for (let y=GY+16; y<VIEW_H; y+=sprH("dirt")||24) tileX("dirt", Math.round(sc), y);
  rectV(0, GY+13, VIEW_W, 1, "#CEA576");
  // 落とし穴：地面をそこだけ消して、背景が見えている状態にする
  if (G) G.pits.forEach(q => {
    const x = Math.round(q.x), w = q.w;
    rectV(x, GY-8, w, VIEW_H-GY+8, "#A8E4F2");        // 地面を消す＝背景が出る
    rectV(x, GY-8, w, 2, "#7EC7DE");                   // ふちの内側にできる影
    // 左右の切り口（草の帯と土の層をそのまま見せる）
    rectV(x-1, GY-8, 1, 7, "#26834F");
    rectV(x-1, GY-1, 1, 14, "#8C6540");
    rectV(x-1, GY+13, 1, VH-GY-13, "#6C4422");
    rectV(x+w, GY-8, 1, 7, "#26834F");
    rectV(x+w, GY-1, 1, 14, "#8C6540");
    rectV(x+w, GY+13, 1, VH-GY-13, "#6C4422");
    // 切り口に垂れる草先。四角い切り抜きに見えないようにする
    rectV(x-1, GY-2, 1, 3, "#3BB273");
    rectV(x+w, GY-2, 1, 2, "#3BB273");
    rectV(x-2, GY-8, 1, 5, "#3BB273");
    rectV(x+w+1, GY-8, 1, 4, "#26834F");
  });
  // サイクルタイムは地面を虹色に（穴のところは地面が無いので描かない）
  if (g.cycleLeft>0){
    for (let x=0;x<VIEW_W;x+=8){
      const h = (x*3 + sc*4) % 360;
      ctx.fillStyle = `hsla(${h},90%,62%,.5)`;
      ctx.fillRect(x*SC,(GY+2)*SC,8*SC,4*SC);
    }
    // はみ出したぶんを、穴の背景で塗り戻す
    if (G) G.pits.forEach(q => rectV(q.x, GY+1, q.w, 6, "#A8E4F2"));
  }

  // アイテム・しょうがいぶつ・主人公
  if (G){
    G.obstacles.forEach(o=>spr(o.key, o.x, o.y));
    G.crows.forEach(k => spr("crow" + (Math.floor(k.bob*2.2) % 3), k.x, k.y));
    G.items.forEach(it=>{
      const y = it.y + Math.sin(it.bob)*2 - 13;
      spr(it.type==="coin" ? "it_coin" : "it_"+it.kind, it.x-13, y);
    });
    drawPlayer(G);
    G.parts.forEach(q=>{
      const a = clamp(1-q.age/q.life,0,1);
      ctx.globalAlpha = a; ctx.fillStyle = q.col;
      ctx.fillRect(Math.round(q.x)*SC, Math.round(q.y)*SC, Math.max(1,q.r|0)*SC, Math.max(1,q.r|0)*SC);
      ctx.globalAlpha = 1;
    });
  }
  ctx.restore();
  VIEW_W = VW; VIEW_H = VH;

  // HUD・文字はドット world の外（1倍座標）で描く
  if (state==="title" && G) drawTitle(G);
  if (state==="howto" && G) drawHowto(G);
  if (state==="over" && G) drawResult(G);
  if (G && state!=="title" && state!=="howto" && state!=="over") drawHUD(G);
  if (G) { G.pops.forEach(drawPop); if (G.banner) drawBanner(G.banner); }
  if (state==="count") drawCount(G);
  if (G && G.flash>0){
    ctx.fillStyle = `rgba(255,122,89,${G.flash*.9})`;
    ctx.fillRect(0,0,VW*SC,VH*SC);
  }
}

function drawPlayer(g){
  const p = g.player;
  if (g.invuln>0 && Math.floor(g.invuln*14)%2===0) return;
  const cycling = g.cycleLeft>0;
  if (cycling){
    ctx.save(); ctx.globalAlpha=.45;
    ctx.fillStyle = `hsl(${(g.scroll*5)%360},90%,70%)`;
    ctx.beginPath();
    ctx.arc((p.x+28)*SC,(p.y+28)*SC, 36*SC, 0, 6.2832);
    ctx.fill(); ctx.restore();
  }
  const f = p.onGround ? (Math.floor(g.scroll/7)%3) : 1;
  spr("rider"+f, p.x, p.y);
}

/* ── トップ画面 ──
   絵はドット絵のまま、文字だけは潰れないよう通常の描画にする。
   囲みの板は置かず、太い縁取りだけで背景から浮かせる。 */
/* ロゴをドット絵にする。
   カタカナを手で打つと形が崩れるので、フォントを小さく描いて
   中間調を捨て、2値のドットにしてから拡大する。作るのは1回だけ。 */
let logoCanvas = null;
function makeLogo(){
  if (logoCanvas) return logoCanvas;
  const TXT = "サイクルライダー", F = 20, PAD = 3;
  const o = document.createElement("canvas");
  let oc = o.getContext("2d", { willReadFrequently: true });
  oc.font = '900 ' + F + 'px ' + FB;
  const w = Math.ceil(oc.measureText(TXT).width) + PAD*2;
  const h = Math.ceil(F * 1.5) + PAD*2;
  o.width = w; o.height = h;
  oc = o.getContext("2d", { willReadFrequently: true });
  oc.font = '900 ' + F + 'px ' + FB;
  oc.textBaseline = "top"; oc.textAlign = "left";
  oc.fillStyle = "#000";
  oc.fillText(TXT, PAD, PAD);
  const d = oc.getImageData(0, 0, w, h).data;
  const on = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++) on[i] = d[i*4+3] >= 110 ? 1 : 0;   // 中間調を捨てる

  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const cc = c.getContext("2d");
  const stampRing = (col, r) => {          // 太さ r の縁を付ける
    cc.fillStyle = col;
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      if (!on[y*w+x]) continue;
      for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++) cc.fillRect(x+dx, y+dy, 1, 1);
    }
  };
  stampRing("#242E3E", 2);                 // 濃い縁
  stampRing("#FFFFFF", 1);                 // 白の縁
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){   // 本体は濃い緑の2トーン
    if (!on[y*w+x]) continue;
    cc.fillStyle = y < h*0.55 ? "#3BB273" : "#26834F";
    cc.fillRect(x, y, 1, 1);
  }
  logoCanvas = c;
  return c;
}
function drawLogo(yScreen, scale){
  const c = makeLogo();
  if (!c.width) return;
  ctx.drawImage(c, 0, 0, c.width, c.height,
    Math.round(VW*SC/2 - c.width*scale/2), Math.round(yScreen),
    c.width*scale, c.height*scale);
}

function titleText(txt, size, fill, y, ring, font, lw, edge){
  const cx = VW*SC/2;
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.lineJoin = "round"; ctx.miterLimit = 2;
  ctx.font = '900 ' + size + 'px ' + (font || FB);
  ctx.fillStyle = "rgba(36,46,62,.25)";              // 落ち影
  ctx.fillText(txt, cx, y + Math.max(2, size*0.07));
  ctx.lineWidth = size * (lw || 0.20);
  ctx.strokeStyle = edge || "#242E3E";                // 外側の縁（既定は濃い色）
  ctx.strokeText(txt, cx, y);
  if (ring){
    ctx.lineWidth = size * 0.09; ctx.strokeStyle = "#FFFFFF";
    ctx.strokeText(txt, cx, y);                       // 白の内側の縁
  }
  ctx.fillStyle = fill;
  ctx.fillText(txt, cx, y);
  ctx.restore();
}

function drawTitle(g){
  // トップはタイトルだけ。あそびかたは 難易度を選んだ後の画面で見せる。
  const bob = Math.round(Math.sin(g.t*2.2)*1.5);
  /* ロゴは4倍。右上のボタンを小さくしたぶん、ロゴを大きくして釣り合いをとった。 */
  drawLogo((24+bob)*SC, 4);
  titleText("ふくを あつめて あたらしい サイクルを つくろう！", 16, "#FFFFFF", (78+bob)*SC);
  // 「えらんでね」はゆっくり点滅させて、ボタンへ目を向けさせる
  const blink = 0.6 + 0.4*Math.sin(g.t*3.2);
  ctx.save(); ctx.globalAlpha = blink;
  // 縁は白。濃い黄の文字を白でふちどると、水色の空の上でよく浮く。
  titleText("▼ むずかしさを えらんでね ▼", 24, "#E09A10", (89+bob)*SC, false, null, 0.22, "#FFFFFF");
  ctx.restore();
}

/* ── あそびかた画面 ──
   内側は 33〜97。いちばん高い絵（指 30px）を入れても収まるよう、
   絵の下端を 66 に置いている。 */
function drawHowto(g){
  /* 箱の幅は、いちばん長い行（150px）に左右の余白を足した 266px。
     3列のアイコンとラベルが重ならないことを確認したうえで決めている。 */
  const PW = 266, PX = Math.round((VW - PW)/2), PY = 20, PH = 88;
  rectV(PX+1, PY+2, PW, PH, "rgba(36,46,62,.28)");
  rectV(PX, PY, PW, PH, "#96602F");
  rectV(PX+2, PY+2, PW-4, PH-4, "#F2E3C6");
  rectV(PX+2, PY+2, PW-4, 2, "#FFF6E6");
  rectV(PX+2, PY+PH-4, PW-4, 2, "#E0C79E");

  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = '900 20px ' + FB;
  ctx.fillStyle = "#96602F";
  ctx.fillText("あそびかた（" + G.d.label + "）", (VW/2)*SC, 30*SC);

  const IB = 70;                        // 絵の下端
  const col = i => PX + PW*(i*2+1)/6;   // 3列の中心
  spr("ic_tap", col(0) - sprW("ic_tap")/2, IB - sprH("ic_tap"));
  spr("it_tee", col(1) - sprW("it_tee")/2, IB - sprH("it_tee"));
  spr("ob_box", col(2) - 34, IB - sprH("ob_box"));
  spr("crow0",  col(2) + 4,  IB - sprH("crow0"));

  ctx.font = '900 17px ' + FB;
  ctx.fillStyle = "#4A2E17";
  ctx.fillText("タップで ジャンプ", col(0)*SC, 78*SC);
  ctx.fillText("ふくを あつめる",   col(1)*SC, 78*SC);
  ctx.fillText("よける",             col(2)*SC, 78*SC);

  // 大事な2行は、しっかり読める大きさにする
  ctx.font = '900 19px ' + FB;
  ctx.fillStyle = "#C0331A";
  ctx.fillText("しょうがいぶつを よけながら ふくを あつめよう！", (VW/2)*SC, 89*SC);
  ctx.font = '900 17px ' + FB;
  ctx.fillStyle = "#C06A10";
  ctx.fillText("25まい あつめると にじいろタイム！", (VW/2)*SC, 99*SC);
  ctx.restore();
}

/* ── ゲームオーバー画面 ──
   遊んでいた景色をそのまま背景に残し、暗く落として結果を重ねる。 */
function drawResult(g){
  const t = g.overT, cx = VW*SC/2;
  ctx.fillStyle = "rgba(36,46,62,.58)";
  ctx.fillRect(0, 0, VW*SC, VH*SC);

  titleText("おつかれさま！", 38, "#FFC93D", 8*SC, true);

  // ★（ひとつずつ出る）
  ctx.save();
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  for (let i=0;i<3;i++){
    const lit = i < g.stars, at = .4 + i*.3;
    let k = 1;
    if (lit){
      if (t < at) continue;
      k = t < at+.22 ? 0.4 + 1.1*Math.min(1,(t-at)/.22) : 1;
      if (t > at+.22) k = 1 + 0.12*Math.max(0, 1-(t-at-.22)/.18);
    }
    ctx.save();
    ctx.translate(cx + (i-1)*38*SC, 42*SC);
    ctx.scale(k, k);
    ctx.font = '900 46px ' + FB;
    ctx.lineWidth = 9; ctx.strokeStyle = "#242E3E"; ctx.strokeText("★", 0, 0);
    ctx.fillStyle = lit ? "#FFC93D" : "rgba(255,255,255,.28)";
    ctx.fillText("★", 0, 0);
    ctx.restore();
  }
  ctx.restore();

  titleText("SCORE", 13, "rgba(255,255,255,.75)", 58*SC);
  titleText(Math.floor(g.score).toLocaleString(), 50, "#FFFFFF", 66*SC, false, FD, 0.10);

  /* 成績はこの2つだけ。
     アイコン・見出し・数字の3列を固定し、上下は中央でそろえる。 */
  const IC_X = 112, LB_X = 130, VAL_X = 222;
  const stat = (icon, label, val, y) => {
    ctx.save();
    ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    spr(icon, IC_X - sprW(icon)/2, y - sprH(icon)/2);
    ctx.textAlign = "left";
    ctx.font = '900 16px ' + FB;
    ctx.lineWidth = 5; ctx.strokeStyle = "#242E3E";
    ctx.strokeText(label, LB_X*SC, y*SC);
    ctx.fillStyle = "#FFFFFF"; ctx.fillText(label, LB_X*SC, y*SC);
    ctx.textAlign = "right";
    ctx.font = '900 19px ' + FD;
    ctx.lineWidth = 5; ctx.strokeStyle = "#242E3E";
    ctx.strokeText(val, VAL_X*SC, y*SC);
    ctx.fillStyle = "#7FE3A8"; ctx.fillText(val, VAL_X*SC, y*SC);
    ctx.restore();
  };
  stat("it_tee",  "あつめた ふく",  g.clothes  + " まい", 99);
  stat("ic_star", "さいだいコンボ", g.maxCombo + " かい", 117);

  const rank = g.stars===3 ? "でんせつの サイクルライダー！"
             : g.stars===2 ? "サイクルの めいじん！"
             : g.stars===1 ? "サイクルの たまご！"
                           : "つぎは もっと ひろえるよ！";
  titleText(rank, 17, "#FFE07A", 130*SC);
}

function drawHUD(g){
  const px = v => v*SC;

  // ハート（残りHP）。2倍。左上に置く
  const HS = 2, hw = sprW("heartF"), hh = sprH("heartF");
  for (let i=0;i<g.maxLives;i++){
    const f = FRAMES[i<g.lives ? "heartF" : "heartE"];
    ctx.drawImage(ATLAS, f[0], f[1], f[2], f[3],
                  (6 + i*(hw*HS+1))*SC, 6*SC, hw*HS*SC, hh*HS*SC);
  }

  /* へんしんゲージは画面上部の中央にもどす。
     ハート 6〜104 ／ ゲージ 110〜210 ／ スコア 〜312 で場所を分けている。 */
  const gw=100, gh=12, gx=Math.round(VW/2 - gw/2), gy=8;
  rectV(gx-2, gy-2, gw+4, gh+4, "rgba(255,255,255,.85)");
  rectV(gx, gy, gw, gh, "#EFE1C8");
  const ratio = g.cycleLeft>0 ? g.cycleLeft/CYCLE_TIME : g.gauge/CYCLE_NEED;
  const fw = Math.max(0, (gw-2)*ratio);
  if (fw>1){
    if (g.cycleLeft>0){
      for (let x=0;x<fw;x+=4){
        ctx.fillStyle = `hsl(${(x*4+g.scroll*4)%360},85%,60%)`;
        ctx.fillRect((gx+1+x)*SC,(gy+1)*SC,4*SC,(gh-2)*SC);
      }
    } else rectV(gx+1, gy+1, fw, gh-2, "#3BB273");
  }
  ctx.fillStyle = "rgba(36,46,62,.35)";
  for (let i=5;i<CYCLE_NEED;i+=5)
    ctx.fillRect((gx+1+(gw-2)*i/CYCLE_NEED)*SC,(gy+1)*SC,SC,(gh-2)*SC);

  ctx.textBaseline = "middle";
  ctx.font = '900 12px ' + FB;
  ctx.textAlign = "center";
  ctx.lineWidth = 4; ctx.strokeStyle = "#FFF6E6"; ctx.lineJoin = "round";
  const gt = g.cycleLeft>0 ? "♻ にじいろタイム！" : `♻ へんしんまで あと ${CYCLE_NEED-g.gauge}まい`;
  ctx.strokeText(gt, px(VW/2), px(gy+gh+8));
  ctx.fillStyle = "#242E3E";
  ctx.fillText(gt, px(VW/2), px(gy+gh+8));

  // スコアとあつめた枚数
  ctx.textAlign = "right";
  ctx.font = '800 12px ' + FB;
  ctx.fillStyle = "rgba(36,46,62,.6)";
  ctx.fillText("SCORE", px(VW-8), px(9));
  ctx.font = '800 30px ' + FD;
  ctx.lineWidth = 5; ctx.strokeStyle = "#fff";
  const st = String(Math.floor(g.score));
  ctx.strokeText(st, px(VW-8), px(24));
  ctx.fillStyle = "#242E3E"; ctx.fillText(st, px(VW-8), px(24));
  ctx.font = '800 13px ' + FB;
  ctx.fillStyle = "#26834F";
  ctx.fillText("ふく " + g.clothes, px(VW-8), px(38));

  /* コンボ表示。つながりの判定は 2.8秒つづくが、
     文字は取った直後 0.7秒だけ出して すぐ消す。 */
  const COMBO_SHOW = 0.7;
  if (g.combo>=3 && g.comboT > 2.8 - COMBO_SHOW){
    const a = clamp((g.comboT - (2.8 - COMBO_SHOW))/COMBO_SHOW, 0, 1);
    ctx.save(); ctx.globalAlpha = .35+a*.65;
    ctx.textAlign="center"; ctx.lineJoin="round";
    ctx.font = '900 26px ' + FD;
    ctx.lineWidth=6; ctx.strokeStyle="#242E3E";
    ctx.strokeText("x"+g.combo, px(VW/2), px(72));
    ctx.fillStyle="#8C6BE0"; ctx.fillText("x"+g.combo, px(VW/2), px(72));
    ctx.font = '900 10px ' + FB;
    ctx.lineWidth=4;
    ctx.strokeText("れんぞく", px(VW/2), px(82));
    ctx.fillText("れんぞく", px(VW/2), px(82));
    ctx.restore();
  }

}

function drawPop(q){
  const a = clamp(1-q.age/q.life,0,1);
  ctx.save(); ctx.globalAlpha = a;
  ctx.font = `800 ${q.big?20:16}px ${FD}`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.lineWidth=5; ctx.strokeStyle="#fff";
  ctx.strokeText(q.text, q.x*SC, q.y*SC);
  ctx.fillStyle=q.col; ctx.fillText(q.text, q.x*SC, q.y*SC);
  ctx.restore();
}
function drawBanner(b){
  const a = b.age<.18 ? b.age/.18 : clamp((b.life-b.age)/.4,0,1);
  /* コンボの数字（内部 68〜84）と重ならないよう、バナーは上に置く。
     ゲージの下端(26) と コンボの上端(68) のあいだ 41〜55 に収める。 */
  const yy = 48 - (1-a)*6;
  ctx.save(); ctx.globalAlpha = a;
  ctx.font='900 22px ' + FB;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const w = ctx.measureText(b.text).width + 44;
  ctx.fillStyle="#fff";
  roundRect(VW*SC/2-w/2, yy*SC-20, w, 40, 20); ctx.fill();
  ctx.strokeStyle=b.col; ctx.lineWidth=3;
  roundRect(VW*SC/2-w/2, yy*SC-20, w, 40, 20); ctx.stroke();
  ctx.fillStyle=b.col; ctx.fillText(b.text, VW*SC/2, yy*SC);
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawCount(g){
  const txt = g.count>0 ? String(g.count) : "GO!";
  const k = 1 + (1-clamp(g.countT/.35,0,1))*.5;
  ctx.save();
  ctx.translate(VW*SC/2, VH*SC/2); ctx.scale(k,k);
  ctx.font='800 96px ' + FD;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.lineWidth=14; ctx.strokeStyle="#fff"; ctx.strokeText(txt,0,0);
  ctx.fillStyle = g.count>0 ? "#FF7A59" : "#3BB273"; ctx.fillText(txt,0,0);
  ctx.restore();
}

/* ══════════════════════════════════════════════
   10. 起動
   ══════════════════════════════════════════════ */
function boot(){
  els.loading.style.display = "none";
  G = newGame();
  last = performance.now();
  requestAnimationFrame(loop);
}
let booted = false;
function bootOnce(){ if (booted) return; booted = true; boot(); }
if (ATLAS.complete && ATLAS.naturalWidth){ atlasReady = true; bootOnce(); }
else {
  ATLAS.onload  = () => { atlasReady = true; bootOnce(); };
  ATLAS.onerror = () => { bootOnce(); };
  setTimeout(bootOnce, 1500);
}

document.addEventListener("visibilitychange", ()=>{
  last = performance.now();
  if (document.hidden && state==="play") pauseGame();
});
})();
</script>
